name: Build

on:
  pull_request:
  push:
    branches:
      - main
    # A push is a release only when it changes what goes into the ROM: the
    # sources, the assets and tables they are generated from, and the scripts
    # and package files the Makefile builds with. Docs, tests, the changelog,
    # and this workflow release nothing. Pull requests build every change.
    paths:
      - src/**
      - data/**
      - assets/**
      - res/**
      - Makefile
      - package.json
      - package-lock.json
      - tools/png2bin
      - tools/strings2c
      - tools/tables2c
      - tools/version2h
      - tools/common.js
      - tools/hash.js

permissions:
  contents: read

jobs:
  # Every pull request and every push to main that changes the game builds the
  # ROM and attaches it to the run, zipped under the ROM's name with the release
  # notes and a PDF of the player's manual. Such a push is a release: it builds
  # without the "+", and the release job publishes the ROM and the manual with
  # those notes.
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    env:
      # The toolchain the ROM is built with. Change the two together.
      GBDK_URL: https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
      GBDK_SHA256: d7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c
    steps:
      - uses: actions/checkout@v7
        with:
          # The patch counts commits, so the build needs the whole history. A
          # pull request builds its own head commit rather than GitHub's merge
          # preview, so its number matches a local build of the same commit.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check the version
        run: |
          version="$(sed -n 's/^VERSION *= *//p' Makefile)"
          heading="$(grep -m1 '^## ' CHANGELOG.md)"
          if [ "$heading" != "## $version" ]; then
            echo "::error::CHANGELOG.md's latest heading is \"$heading\", but VERSION in the Makefile is $version."
            exit 1
          fi
          if ! grep -qF "'fork': '$version FORK'" assets/strings.js; then
            echo "::error::The credits card's fork line in assets/strings.js isn't \"$version FORK\"."
            exit 1
          fi

      - name: Write the release notes
        env:
          # The notes are the changelog lines the change adds, so on a pull
          # request they preview what its merge would publish.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          base="$BASE"
          # A push that creates the branch has no earlier commit to compare with.
          git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD^
          ./tools/changelog2notes "$base" > "$RUNNER_TEMP/out/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/out/release-notes.md" ]; then
            echo "::notice::CHANGELOG.md gained no lines, so the release notes will be GitHub's list of merged pull requests."
          fi

      - name: Install GBDK-2020
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gbdk.tar.gz" "$GBDK_URL"
          echo "$GBDK_SHA256  $RUNNER_TEMP/gbdk.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gbdk.tar.gz" -C "$RUNNER_TEMP"

      - name: Build the ROM
        id: build
        env:
          # The Makefile appends bin/lcc straight onto GBDK_HOME, so the
          # trailing slash is required. GBDK 4.5.0's lcc aborts with a buffer
          # overflow once this path runs past about 100 characters.
          GBDK_HOME: ${{ runner.temp }}/gbdk/
          RELEASE: ${{ github.event_name == 'push' && '1' || '' }}
        run: |
          node --version
          npm ci --ignore-scripts
          make RELEASE="$RELEASE"
          version="$(sed -n 's/^#define GAME_VERSION "\(.*\)"$/\1/p' src/version.h)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/out"
          cp LabyrinthOfTheDragon.gbc "$RUNNER_TEMP/out/LabyrinthOfTheDragon-$version.gbc"

      - name: Print the manual
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet markdown==3.10.3
          "$RUNNER_TEMP/venv/bin/python" tools/docs/render_manual.py \
            "$RUNNER_TEMP/out/LabyrinthOfTheDragon-manual.pdf" \
            --links "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$(git rev-parse HEAD)/docs"

      - uses: actions/upload-artifact@v7
        with:
          name: LabyrinthOfTheDragon-${{ steps.build.outputs.version }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  # The only job with a write token. It checks out nothing, and publishes the
  # ROM, manual, and notes the build job made as a release tagged with its
  # version.
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: LabyrinthOfTheDragon-${{ needs.build.outputs.version }}
          path: out

      - name: Publish the release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's list of merged pull requests stands in when the push added
          # no changelog lines.
          if [ -s out/release-notes.md ]; then notes=(--notes-file out/release-notes.md); else notes=(--generate-notes); fi
          gh release create "$VERSION" "out/LabyrinthOfTheDragon-$VERSION.gbc" \
            out/LabyrinthOfTheDragon-manual.pdf \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            "${notes[@]}"
