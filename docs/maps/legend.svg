<svg xmlns="http://www.w3.org/2000/svg" width="520" height="602" viewBox="0 0 520 602" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" role="img" aria-label="Map legend">
<title>Map legend</title>
<defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#26211d"/><rect width="2.6" height="6" fill="#e0722b"/></pattern>
</defs>
<rect width="520" height="602" fill="#f3ead7"/>
<text x="16" y="20" font-size="13" font-weight="bold" fill="#26211d">Legend</text>
<rect x="16" y="31.0" width="24" height="24" fill="#fbf6ea" stroke="#e3d8c1" stroke-width="1.4"/>
<text x="52" y="47.0" font-size="12" fill="#26211d">Floor you can see</text>
<rect x="16" y="57.0" width="24" height="24" fill="#26211d" stroke="#e3d8c1" stroke-width="1.4"/>
<text x="52" y="73.0" font-size="12" fill="#26211d">Wall or black void</text>
<rect x="16" y="83.0" width="24" height="24" fill="url(#hatch)" stroke="#e0722b" stroke-dasharray="3 2" stroke-width="1.4"/>
<text x="52" y="99.0" font-size="12" fill="#26211d">Hidden floor: looks like void or wall, but you can walk it</text>
<rect x="18.0" y="111.0" width="20" height="20" rx="4" fill="#e0722b" stroke="#8a3d10" stroke-width="1.2"/><text x="28.0" y="125.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">H1</text>
<text x="52" y="125.0" font-size="12" fill="#26211d">Hidden passage, numbered on each floor</text>
<circle cx="28.0" cy="147.0" r="9.5" fill="#ffffff" stroke="#2e7d4f" stroke-width="2.6"/><text x="28.0" y="151.7" font-size="13" fill="#1d4d31" text-anchor="middle" font-weight="bold">@</text>
<text x="52" y="151.0" font-size="12" fill="#26211d">Where you arrive on the floor</text>
<circle cx="28.0" cy="173.0" r="9.5" fill="#ffffff" stroke="#26211d" stroke-width="1.4"/><text x="28.0" y="177.7" font-size="13" fill="#26211d" text-anchor="middle" font-weight="bold">a</text>
<text x="52" y="177.0" font-size="12" fill="#26211d">Stairs or doorway; both ends share a letter</text>
<circle cx="28.0" cy="199.0" r="9.5" fill="#ffffff" stroke="#8a5a2b" stroke-width="3.0"/><text x="28.0" y="203.7" font-size="13" fill="#26211d" text-anchor="middle" font-weight="bold">b</text>
<text x="52" y="203.0" font-size="12" fill="#26211d">Stairs behind a door that opens later</text>
<circle cx="28.0" cy="225.0" r="9.5" fill="#4d4640" stroke="#1c1814" stroke-width="1.4"/><text x="28.0" y="229.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">c</text>
<text x="52" y="229.0" font-size="12" fill="#26211d">Hole: drops you one way</text>
<circle cx="28.0" cy="251.0" r="9.5" fill="#b43fc1" stroke="#5c1a63" stroke-width="1.4"/><text x="28.0" y="255.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">d</text>
<text x="52" y="255.0" font-size="12" fill="#26211d">Portal: sends you one way</text>
<circle cx="28.0" cy="277.0" r="9" fill="none" stroke="#4d4640" stroke-width="1.8" stroke-dasharray="2.6 2"/><text x="28.0" y="281.7" font-size="13" fill="#4d4640" text-anchor="middle" font-weight="bold">c</text>
<text x="52" y="281.0" font-size="12" fill="#26211d">Where a hole or portal lands you</text>
<rect x="18.0" y="293.0" width="20" height="20" rx="4" fill="#2e7d4f" stroke="#15492a" stroke-width="1.2"/><text x="28.0" y="305.9" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">DOWN</text>
<text x="52" y="307.0" font-size="12" fill="#26211d">Stairs down to the next floor</text>
<rect x="18.0" y="319.0" width="20" height="20" rx="4" fill="#2e7d4f" stroke="#15492a" stroke-width="1.2"/><text x="28.0" y="333.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">UP</text>
<text x="52" y="333.0" font-size="12" fill="#26211d">The stairs up and out, on floor 8</text>
<rect x="18.0" y="345.0" width="20" height="20" rx="4" fill="#e2a82b" stroke="#6e4b0e" stroke-width="1.2"/><text x="28.0" y="359.0" font-size="11" fill="#2b1d05" text-anchor="middle" font-weight="bold">C1</text>
<text x="52" y="359.0" font-size="12" fill="#26211d">Chest</text>
<rect x="18.0" y="371.0" width="20" height="20" rx="4" fill="#e2a82b" stroke="#b0211a" stroke-width="2.6"/><text x="28.0" y="385.0" font-size="11" fill="#2b1d05" text-anchor="middle" font-weight="bold">C4</text>
<text x="52" y="385.0" font-size="12" fill="#26211d">Locked chest (magic key or puzzle)</text>
<rect x="18.0" y="397.0" width="20" height="20" rx="4" fill="#3d6ea5" stroke="#1d3a5c" stroke-width="1.2"/><text x="28.0" y="411.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">L1</text>
<text x="52" y="411.0" font-size="12" fill="#26211d">Lever</text>
<rect x="18.0" y="423.0" width="20" height="20" rx="4" fill="#5e554b" stroke="#2e2924" stroke-width="1.2"/><text x="28.0" y="437.0" font-size="11" fill="#ffd98a" text-anchor="middle" font-weight="bold">S1</text>
<text x="52" y="437.0" font-size="12" fill="#26211d">Sconce, unlit until you or a puzzle light it</text>
<circle cx="28.0" cy="459.0" r="9.5" fill="#e0862b" stroke="#7a4310" stroke-width="1.2"/><text x="28.0" y="463.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">F</text>
<text x="52" y="463.0" font-size="12" fill="#26211d">Burning flame (orange, green, or purple): relight your torch</text>
<rect x="18.0" y="475.0" width="20" height="20" rx="4" fill="#8b5a2b" stroke="#4a2e13" stroke-width="1.2"/><text x="28.0" y="489.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">!</text>
<text x="52" y="489.0" font-size="12" fill="#26211d">Sign</text>
<rect x="18.0" y="501.0" width="20" height="20" rx="4" fill="#6a3d9a" stroke="#33184f" stroke-width="1.2"/><text x="28.0" y="515.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">E</text>
<text x="52" y="515.0" font-size="12" fill="#26211d">Elite monster: see the floor's key</text>
<rect x="18.0" y="527.0" width="20" height="20" rx="4" fill="#8e1b1b" stroke="#3f0b0b" stroke-width="1.2"/><text x="28.0" y="541.7" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">B</text>
<text x="52" y="541.0" font-size="12" fill="#26211d">Floor boss</text>
<rect x="18.0" y="553.0" width="20" height="20" rx="4" fill="#6b4423" stroke="#35210f" stroke-width="1.2"/><text x="28.0" y="567.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">D5</text>
<text x="52" y="567.0" font-size="12" fill="#26211d">Door</text>
<rect x="18.0" y="579.0" width="20" height="20" rx="4" fill="#f2c14e" stroke="#8a6410" stroke-width="1.2"/><text x="28.0" y="593.0" font-size="11" fill="#2b1d05" text-anchor="middle" font-weight="bold">?1</text>
<text x="52" y="593.0" font-size="12" fill="#26211d">Special tile: see the floor's key</text>
</svg>
